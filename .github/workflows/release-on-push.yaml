name: Release
run-name: '[${{ github.ref_name }}] triggered by [${{ github.event_name }}/${{ github.actor }}]'

on:
  push:
    branches: '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: krauters/shared-workflows/.github/workflows/release.yaml@b34c0968945cbd3d091d1d621effedb43029c3dd # main
    secrets:
      GH_TOKEN_RELEASES: ${{ secrets.GH_TOKEN_RELEASES }}
